name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/rabbit-puzzle-game-ui-pcrfmq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 퍼즐 유일성·연결성·정답 일치를 검증하고 index.html 내장 사본을 최신화한다.
      # 검증에 실패하면 여기서 배포가 멈춘다.
      - name: 퍼즐 검증 및 내장 사본 갱신
        run: node tools/build.mjs

      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          cp index.html puzzles.json _site/
          touch _site/.nojekyll

      # Pages 활성화는 워크플로가 대신 해줄 수 없다.
      # GITHUB_TOKEN 에는 Pages 사이트 "생성" 권한이 없어서(저장소 관리자 권한 필요)
      # 최초 1회는 사람이 Settings > Pages 에서 켜야 한다.
      - name: Pages 활성화 여부 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages 활성화 확인됨"
          else
            echo "::error title=GitHub Pages 가 꺼져 있습니다::최초 1회 수동 설정이 필요합니다"
            echo "레포 Settings > Pages 로 가서 Source 를 'GitHub Actions' 로 설정해 주세요."
            echo "이 레포는 비공개(private)입니다. 비공개 레포의 Pages 는 GitHub Pro 이상에서만 됩니다."
            echo "무료 플랜이라면 레포를 공개로 바꾸거나, Pro 로 업그레이드해야 합니다."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
