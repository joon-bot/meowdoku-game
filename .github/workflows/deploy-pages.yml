name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 퍼즐 유일성·연결성·정답 일치를 검증하고 index.html 내장 사본을 최신화한다.
      # 검증에 실패하면 여기서 배포가 멈춘다.
      - name: 퍼즐 검증 및 내장 사본 갱신
        run: node tools/build.mjs

      # 게임이 돌아가는 데 필요한 것 전부. 하나라도 빠지면 PWA 가 조용히 반쪽이 된다:
      #   manifest.json  없으면 "홈 화면에 추가" 가 앱이 아니라 북마크가 된다
      #   sw.js          없으면 오프라인이 안 된다
      #   assets/        없으면 토끼 그림과 둥근 한글 폰트가 통째로 사라진다
      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          cp index.html puzzles.json manifest.json sw.js _site/
          cp -r assets _site/
          touch _site/.nojekyll

      # 서비스워커 캐시 키에 커밋 해시를 박는다.
      # 파일 이름이 그대로라(rabbit.png, jua.woff2 …) 키가 고정이면
      # 한 번 캐시된 이미지·폰트가 새 배포 뒤에도 계속 옛것으로 남는다.
      - name: 서비스워커 캐시 버전 스탬프
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/sw.js
          grep -n "^const VERSION" _site/sw.js

      - name: 빠진 파일 없는지 확인
        run: |
          for f in index.html puzzles.json manifest.json sw.js \
                   assets/rabbit.png assets/rabbit_jump.png assets/rabbit_sad.png \
                   assets/icon-192.png assets/icon-512.png \
                   assets/fonts/jua.woff2 assets/fonts/gowun.woff2; do
            [ -s "_site/$f" ] || { echo "::error::배포 묶음에 $f 가 없습니다"; exit 1; }
          done
          echo "필수 파일 전부 확인"
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
